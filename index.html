<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生字拆解小老師 V3</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="hero">
      <div class="hero-icon">🧩</div>
      <div>
        <p class="eyebrow">教師備課小工具 · V3</p>
        <h1>生字拆解小老師</h1>
        <p>生字分析、共同部件、教材模式，還可以直接出測驗！</p>
      </div>
    </header>

    <section class="search-card">
      <label for="character">請輸入一個生字</label>
      <div class="search-row">
        <input id="character" maxlength="1" value="扭" aria-label="生字">
        <button id="analyzeBtn">🔍 生字分析</button>
      </div>
      <div class="quick"><span>試試看：</span>
        <button class="quick-btn" data-char="扭">扭</button><button class="quick-btn" data-char="抱">抱</button>
        <button class="quick-btn" data-char="拍">拍</button><button class="quick-btn" data-char="打">打</button>
        <button class="quick-btn" data-char="推">推</button><button class="quick-btn" data-char="拉">拉</button>
        <button class="quick-btn" data-char="找">找</button><button class="quick-btn" data-char="拾">拾</button>
      </div>
      <div class="tool-row">
        <button id="componentBtn" class="secondary-btn">🎨 找相同部件</button>
        <button id="lessonBtn" class="secondary-btn">📚 教材模式</button>
        <button id="quizBtn" class="quiz-btn">📝 出測驗</button>
        <button id="printBtn" class="secondary-btn">🖨️ 列印教材</button>
      </div>
    </section>
    <section id="result" class="result" aria-live="polite"></section>
  </main>
  <script src="app.js"></script>
</body>
</html>
